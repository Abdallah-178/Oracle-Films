- # ====== Region: Watchlist ===================================
  id: 35405236186955131
  identification: 
    name: Watchlist
    type: Cards

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select DISTINCT ID,
              movie_id,
             user_id,
             watched_yn,
             watched,
             case when watched_yn = 'Y' then 'Watched' end as WATCHED_LABEL,
             case when watched_yn = 'Y'
                  then 'Marked as watched ' || apex_util.get_since(watched)
                  else 'Added to watchlist ' || apex_util.get_since(created)
                  end as movie_status,
             title,
             poster_url,
             release_date,
             to_char(release_date, 'YYYY') as release_year,
             floor( to_char(release_date, 'YYYY') / 10) * 10 as decade,
             runtime,
             vote_average,
             created,
             to_char(created, 'MM/YYYY') as created_on,
             created_by,
             updated,
             updated_by
        from watchlist
       where user_id = :USER_ID

  order-by: 
    type: None

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Cards Container
    template-options: 
    - '#DEFAULT#'
    - t-CardsRegion--hideHeader js-addHiddenHeadingRoleDesc
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: false
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    id: 35405366330955132
    appearance: 
      layout: Grid
      grid-columns: Auto

    card: 
      primary-key-column-1: ID

    title: 
      advanced-formatting: false
      column: TITLE

    subtitle: 
      advanced-formatting: false

    body: 
      advanced-formatting: true
      html-expression: |
        Release Year: &RELEASE_YEAR.
        <br>
        Rating: &VOTE_AVERAGE.

    secondary-body: 
      advanced-formatting: false
      column: WATCHED_LABEL

    icon-and-badge: 
      icon-source: No Icon
      badge-column: WATCHED_LABEL

    media: 
      advanced-formatting: false
      source: URL Column
      url-column: POSTER_URL
      position: Body
      appearance: Auto
      sizing: Fit

    performance: 
      lazy-loading: false

    pagination: 
      type: Scroll
      show-total-count: false

    actions: 
    - # ====== Action: Full Card ===================================
      id: 35405463773955133
      identification: 
        type: Full Card

      layout: 
        sequence: 10

      link: 
        type: Redirect to Page in this Application
        target: 
          url: 'f?p=&APP_ID.:3:&SESSION.::&DEBUG.::P3_ID,P3_PREVIOUS_PAGE_ID:&MOVIE_ID.,1'
          page: 3 # Movie Details
          values: 
            p3_id: '&MOVIE_ID.'
            p3_previous_page_id: 1

