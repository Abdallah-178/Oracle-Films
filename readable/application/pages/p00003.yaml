- # ====== Process: Add Movie ==================================
  id: 35401966585944551
  identification: 
    name: Add Movie
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      insert into watchlist
          (
              movie_id,
              user_id,
              watched_yn,
              title,
              poster_url,
              release_date,
              runtime,
              vote_average
          )
      values
          (
              :P3_ID,
              :USER_ID,
              'N',
              :P3_TITLE,
              'https://image.tmdb.org/t/p/w500'||:P3_POSTER_PATH,
              :P3_RELEASE_DATE,
              :P3_RUNTIME,
              :P3_VOTE_AVERAGE
          );

  execution: 
    sequence: 50
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: Add_to_Watch_List # 35404460805955123

- # ====== Process: Remove Movie ===============================
  id: 35404778089955126
  identification: 
    name: Remove Movie
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      delete from watchlist
       where movie_id = :P3_ID
         and user_id = :USER_ID;

  execution: 
    sequence: 60
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: Remove_From_Watch_list # 35404598740955124

- # ====== Process: update Movie ===============================
  id: 35404888378955127
  identification: 
    name: update Movie
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      update watchlist
         set watched_yn = 'Y',
             watched = SYSDATE
       where movie_id = :P3_ID
         and user_id = :USER_ID;

  execution: 
    sequence: 70
    point: Processing
    run-process: Once Per Page Visit (default)

