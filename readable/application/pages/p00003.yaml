- # ====== Region: Header ======================================
  id: 35403516117955114
  identification: 
    name: Header
    title: Header
    type: Cards

  source: 
    location: REST Source
    rest-source: Movie Details # 35247269302233910

  local-post-processing: 
    type: SQL Query
    sql-query: |
      select id,
             title,
             'https://image.tmdb.org/t/p/w500'||poster_path as poster_url,
             'https://image.tmdb.org/t/p/w500'||backdrop_path as backdrop_url,
             release_date,
             runtime,
             trunc(runtime/60) || 'hr ' ||
                  extract (minute from numtodsinterval((runtime/60), 'HOUR' )) || 'min'
                  as runtime_friendly,
             vote_average,
             tagline
        from #APEX$SOURCE_DATA#

  layout: 
    sequence: 20
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Cards Container
    template-options: 
    - '#DEFAULT#'
    - t-CardsRegion--hideHeader js-addHiddenHeadingRoleDesc
    - t-CardsRegion--styleB
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: false
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  parameters: 
  - # ====== Parameter: movie_id =================================
    id: 35403784559955116
    identification: 
      name: movie_id # 35247895971233912

    operation: 
      http-method: All
      database-operation: All

    parameter: 
      direction: In
      data-type: String

    value: 
      type: REST Source Default

  attributes: 
    id: 35403640419955115
    appearance: 
      layout: Horizontal (Row)
      css-classes: 
      - movie-header-card

    card: 
      primary-key-column-1: ID

    title: 
      advanced-formatting: false
      column: TITLE

    subtitle: 
      advanced-formatting: true
      html-expression: |
        <div class="movie-details">
            <span title="Release Date">Released &RELEASE_DATE.</span> &middot;
            <span title="Runtime">&RUNTIME_FRIENDLY.</span> &middot;
            <span title="&VOTE_AVERAGE. out of 10"><span class="fa fa-star" aria-hidden="true"></span> &VOTE_AVERAGE.</span>
        </div>

    body: 
      advanced-formatting: false

    secondary-body: 
      advanced-formatting: false

    icon-and-badge: 
      icon-source: Image URL
      image-url: '&POSTER_URL.'
      icon-css-classes: w100 h150
      icon-position: Start

    media: 
      advanced-formatting: false
      source: URL Column
      url-column: BACKDROP_URL
      position: As Background Image
      appearance: Auto
      sizing: Cover

    performance: 
      lazy-loading: false

    pagination: 
      type: Scroll
      show-total-count: false

